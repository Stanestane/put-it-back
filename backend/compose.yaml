name: put-it-back
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?required}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?required}
      METABASE_DB_PASSWORD: ${METABASE_DB_PASSWORD:?required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./schema.sql:/schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 256mb
    mem_limit: 1536m
    logging: *logging
  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://telemetry_api:${API_DB_PASSWORD}@db/telemetry
      INGEST_KEY: ${INGEST_KEY:?required}
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    logging: *logging
  proxy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    environment:
      # HTTPS terminates at the existing public gateway; this listener is on the LAN.
      TELEMETRY_HOST: ${TELEMETRY_HOST:-http://putitback.vdsolution.com}
    ports:
      - "${BIND_IP:-10.0.7.57}:80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [api]
    mem_limit: 256m
    logging: *logging
  metabase:
    image: ${METABASE_IMAGE:-metabase/metabase:latest}
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: db
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD}
      MB_ENCRYPTION_SECRET_KEY: ${METABASE_ENCRYPTION_KEY:?required}
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
      MB_SITE_URL: http://localhost:3300
      JAVA_TIMEZONE: UTC
      JAVA_OPTS: -Xmx1536m
    ports: ["127.0.0.1:3300:3000"]
    depends_on:
      db: {condition: service_healthy}
    mem_limit: 2304m
    logging: *logging
volumes:
  pgdata:
  caddydata:
  caddyconfig:
